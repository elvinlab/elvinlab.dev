# CI + production deploy. A push to main runs the gates once and, only if all pass, deploys.
# Flow, rollback and the variables/secrets this uses: docs/CONFIGURATION.md (sections 5 and 7);
# decisions: docs/adr/0011 and docs/adr/0012.
name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A push to main always runs to completion; a production deploy must finish.
  cancel-in-progress: false

env:
  PRODUCTION_WORKER: elvinlab
  WORKERS_SUBDOMAIN: lab-previews

jobs:
  # The gates run as parallel jobs (wall time is the slowest one, not the sum), once per release,
  # directly on the push to main — there is no PR gate (ADR 0012): the `protect-main` ruleset only
  # requires deletion/non_fast_forward/required_linear_history, not a passing check, so an untested
  # commit CAN reach main; a failing gate here blocks the deploy, not the push.
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Resolve the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm depcruise
      - run: pnpm typecheck
      - run: pnpm test
      - name: Job duration
        if: always()
        run: |
          echo "static: $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  # Notes-only fast lane (ADR 0016): when every path in the push is a published note or the
  # changelog/release metadata, e2e and lighthouse are skipped and `notes-gate` (build + budgets)
  # stands in. Anything else, an unknown base or an unreadable diff keeps the full stack.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      notes_only: ${{ steps.scope.outputs.notes_only }}
      profiles_relevant: ${{ steps.scope.outputs.profiles_relevant }}
      notes_slugs: ${{ steps.scope.outputs.notes_slugs }}
    steps:
      - name: Decide whether the push only publishes notes
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          notes_only=false
          # The adopter profiles only matter when the push can change what a feature switch does:
          # a push that touches nothing but docs, trackers, READMEs, issue templates or content
          # cannot. Anything else, an unknown base or an unreadable diff keeps them on.
          profiles_relevant=true
          # Slugs of the notes this push publishes or edits (space separated), for the post-deploy
          # smoke check. Only filled on the notes-only lane; empty falls back to the fixed URLs.
          notes_slugs=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[].filename')" \
              && [ -n "$files" ] && [ "$(printf '%s\n' "$files" | wc -l)" -lt 300 ]; then
              if ! printf '%s\n' "$files" | grep -qvE '^(apps/web/src/content/notes/|apps/web/src/content/(changelog|releases)\.json$)'; then
                notes_only=true
                # Removed files are not published, so they are left out. Fail closed if the
                # live-note lookup fails: do not silently omit required deployed checks.
                if live="$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq '.files[] | select(.status != "removed") | .filename')"; then
                  notes_slugs="$(printf '%s\n' "$live" | sed -nE 's#^apps/web/src/content/notes/([a-z0-9-]+)/.*#\1#p' | sort -u | tr '\n' ' ' | sed 's/ *$//')"
                else
                  echo "FAIL: unable to determine published note targets"
                  exit 1
                fi
              fi
              if ! printf '%s\n' "$files" | grep -qvE '^(docs/|odd/|README(\.en)?\.md$|\.github/ISSUE_TEMPLATE/|apps/web/src/content/)'; then
                profiles_relevant=false
              fi
            fi
          fi
          {
            echo "notes_only=$notes_only"
            echo "profiles_relevant=$profiles_relevant"
            echo "notes_slugs=$notes_slugs"
          } >> "$GITHUB_OUTPUT"
          {
            echo "notes-only fast lane: $notes_only"
            echo "adopter profiles relevant: $profiles_relevant"
            echo "notes to smoke-check after deploy: ${notes_slugs:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Fast-lane stand-in for e2e/lighthouse: the build validates note frontmatter and translations,
  # the two budgets catch a note that bloats the page, `check:built-notes` proves every published
  # note reached the output (page, index, sitemap, feed, topics, internal links) and the changelog
  # page spec runs because a publish always edits changelog.json. Runs only when `changes` says
  # notes-only. docs:config and changelog:audit are not CI checks (publish-note runs the audit).
  notes-gate:
    name: notes-gate
    needs: changes
    if: ${{ needs.changes.outputs.notes_only == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Resolve the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - name: Check production JavaScript gzip budget
        run: pnpm check:js-budget
      - name: Check page weight budget (inline CSS and HTML per page type)
        run: pnpm check:page-weight
      - name: Check the built notes output (pages, index, sitemap, feed, topics, links)
        run: pnpm check:built-notes
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for browser checks
        run: pnpm exec playwright install --with-deps chromium
      - name: Changelog page spec (a note publish always edits changelog.json)
        run: pnpm test:e2e tests/browser/changelog.spec.ts
      - name: Job duration
        if: always()
        run: |
          echo "notes-gate: $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  # Sharded: Playwright splits the tests across 4 runners (`--shard=N/4`), so the slowest gate is a
  # quarter of the suite. Every shard builds and checks the JS budget (cheap); the steps that only
  # inspect the build (white-label, version.txt, image optimization) run in shard 1 only. `checks`
  # needs this whole matrix, so it still passes only if every shard does. Skipped on the notes-only
  # fast lane (a skipped need does not fail `checks`).
  e2e:
    name: e2e
    needs: changes
    if: ${{ needs.changes.outputs.notes_only != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Resolve the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm --filter web build
      - name: Check production JavaScript gzip budget
        run: pnpm check:js-budget
      - name: Check page weight budget (inline CSS and HTML per page type)
        run: pnpm check:page-weight
      - name: Install Chromium for browser checks
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/4
      - name: White-label build (once)
        if: matrix.shard == 1
        run: pnpm test:white-label
      - name: Read the candidate blog flag before deployment
        id: smoke-config
        run: |
          blog_enabled="$(node --import ./apps/web/scripts/register-alias.mjs --input-type=module -e '
            import { siteConfig } from "./apps/web/src/site.config.ts";
            import { parseSiteConfig } from "./apps/web/src/shared/config/schema.ts";
            process.stdout.write(String(parseSiteConfig(siteConfig).features.blog));
          ')"
          case "$blog_enabled" in
            true|false) ;;
            *) echo "FAIL: unknown candidate blog flag"; exit 1 ;;
          esac
          echo "blog_enabled=$blog_enabled" >> "$GITHUB_OUTPUT"
      - name: Write version.txt with commit SHA
        if: matrix.shard == 1
        run: echo "${GITHUB_SHA}" > apps/web/dist/client/version.txt
      - name: Assert build-time image optimization
        if: matrix.shard == 1
        run: |
          # Only meaningful once the site ships raster images (note covers, screenshots).
          sources="$(find apps/web/src -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) | wc -l)"
          webp="$(find apps/web/dist/client/_astro -name '*.webp' | wc -l)"
          echo "source raster images: $sources | optimized WebP: $webp"
          if [ "$sources" -gt 0 ]; then test "$webp" -gt 0; else echo "No raster sources yet; skipping."; fi
      - name: Job duration
        if: always()
        run: |
          echo "e2e (shard ${{ matrix.shard }}/4): $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  # Adopter profiles (odd/tasks/e2e-follows-config.md): the same e2e suite against this site with
  # some features switched off (apps/web/scripts/e2e-profiles.ts), proving that someone who turns
  # features off in site.config.ts still gets a green pipeline. One runner per profile, in parallel
  # with e2e and lighthouse, so a profile faster than the slowest gate adds nothing to the release.
  # NOT a deploy gate yet: `continue-on-error` keeps a red profile from failing the run, and it is
  # not in `checks.needs`. To make it blocking once the durations and stability are known, add
  # `profiles` to the needs of `checks` and drop `continue-on-error`. Skipped when the push cannot
  # change what a switch does (docs, trackers, READMEs, content).
  profiles:
    name: profile ${{ matrix.profile }}
    needs: changes
    if: ${{ needs.changes.outputs.profiles_relevant == 'true' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        profile: [quiet, blog-only, me-only, bare]
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Resolve the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for browser checks
        run: pnpm exec playwright install --with-deps chromium
      - name: e2e at 1280 px with the ${{ matrix.profile }} profile
        env:
          E2E_FEATURE_PROFILE: ${{ matrix.profile }}
        run: pnpm test:e2e:quick
      - name: Job duration
        if: always()
        run: |
          echo "profile ${{ matrix.profile }}: $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  # Sharded: the URLs of lighthouserc.json (13 today) split across 2 runners (`--shard=N/2`, every 2nd URL),
  # still 3 runs per URL and the same assertions. `checks` needs this whole matrix, so it passes only
  # if both shards do (a matrix job's result is `failure` when any shard failed).
  lighthouse:
    name: lighthouse
    needs: changes
    if: ${{ needs.changes.outputs.notes_only != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Resolve the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium for Lighthouse
        run: pnpm exec playwright install --with-deps chromium
      - name: Check mobile Lighthouse budgets
        run: pnpm test:lighthouse --shard=${{ matrix.shard }}/2
      - name: Job duration
        if: always()
        run: |
          echo "lighthouse (shard ${{ matrix.shard }}/2): $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  # Stable aggregate: the ruleset requires a status named `checks`, so the name is kept.
  checks:
    name: checks
    # `changes` is listed so a failure there fails `checks` instead of silently skipping every gate.
    needs: [static, changes, notes-gate, e2e, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - name: Every gate passed or was intentionally skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "gate results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
      - name: Job duration
        if: always()
        run: |
          echo "checks: $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: deploy
    # `changes` is listed only to read its `notes_slugs` output in the smoke check below.
    needs: [checks, changes]
    # always(): `checks` itself runs with if: always(), so without this, a failed/cancelled gate
    # would make `needs.checks` read as skipped and the explicit result check below would never run.
    if: ${{ always() && needs.checks.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ env.PRODUCTION_WORKER }}.${{ env.WORKERS_SUBDOMAIN }}.workers.dev
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Resolve the pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
        env:
          SITE_INDEXABLE: 'true'
          # Public by design (shipped in the HTML); set per GitHub environment, empty disables the feature.
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.PUBLIC_CF_ANALYTICS_TOKEN }}
      - name: Read the candidate blog flag before deployment
        id: smoke-config
        run: |
          blog_enabled="$(node --import ./apps/web/scripts/register-alias.mjs --input-type=module -e '
            import { siteConfig } from "./apps/web/src/site.config.ts";
            import { parseSiteConfig } from "./apps/web/src/shared/config/schema.ts";
            process.stdout.write(String(parseSiteConfig(siteConfig).features.blog));
          ')"
          case "$blog_enabled" in
            true|false) ;;
            *) echo "FAIL: unknown candidate blog flag"; exit 1 ;;
          esac
          echo "blog_enabled=$blog_enabled" >> "$GITHUB_OUTPUT"
      - name: Write version.txt with commit SHA
        run: echo "${GITHUB_SHA}" > apps/web/dist/client/version.txt
      - name: Deploy
        id: deploy
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --name "$PRODUCTION_WORKER"
      - name: Smoke check with rollback on failure
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Explicitly derived from this candidate, never inferred from missing deployed routes.
          SMOKE_BLOG: ${{ steps.smoke-config.outputs.blog_enabled }}
          # Notes published by this push (notes-only lane); empty checks fixed blog URLs if enabled.
          SMOKE_NOTES: ${{ needs.changes.outputs.notes_slugs }}
        run: |
          if ! bash ../../.github/scripts/smoke-check.sh "https://$PRODUCTION_WORKER.$WORKERS_SUBDOMAIN.workers.dev" "${GITHUB_SHA}"; then
            echo "Smoke check failed, rolling back..."
            pnpm exec wrangler rollback --name "$PRODUCTION_WORKER" --message "Automatic rollback: smoke check failed for ${GITHUB_SHA::7}"
            exit 1
          fi
      - name: Job duration
        if: always()
        run: |
          echo "deploy: $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

