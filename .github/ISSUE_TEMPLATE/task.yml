name: Task
description: A work unit, written as a self-contained delegation brief (agentic-dev-setup pattern).
title: "Txx "
body:
  - type: dropdown
    id: tier
    attributes:
      label: Tier
      description: Who does the work. Tier 1 and 2 go to OpenCode via herdr; Claude Code reviews every diff.
      options:
        - "1 · Trivial (TIER1_MODEL)"
        - "2 · Bounded (TIER2_MODEL)"
        - "3 · Complex (Claude Code)"
        - "Human"
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One sentence.
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files
      description: Exact files to create or modify. Everything else is read-only.
    validations:
      required: true
  - type: textarea
    id: conventions
    attributes:
      label: Conventions
      description: Point to an existing file as the example to follow.
      value: Follow `CLAUDE.md` and `docs/CONVENTIONS.md`.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Commands the agent must run and report.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      value: Do not commit, push, install dependencies or touch config or secrets unless stated here.
